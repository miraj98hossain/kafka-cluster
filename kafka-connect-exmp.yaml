kafka-connect:
      image: cnfldemos/kafka-connect-datagen:0.6.2-7.5.0
      # image: confluentinc/cp-kafka-connect:7.5.0
      container_name: kafka-connect
      depends_on:
        - zookeeper
        - zookeeper-2
        - broker
        - schema-registry
      ports:
        - 8083:8083
      volumes:
        - /home/kafka/kafka-data/connect:/var/lib/kafka-connect
        - "/usr/share/zoneinfo/:/usr/share/zoneinfo:ro"
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
      environment:
        TZ: Asia/Dhaka
        CONNECT_BOOTSTRAP_SERVERS: "broker:29092"
        CONNECT_REST_PORT: 8083
        CONNECT_GROUP_ID: compose-connect-group
        CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
        CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
        CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
        CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
        CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
        CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
        CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
        CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
        CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "[%d] %p %X{connector.context}%m (%c:%L)%n"
        CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR"
        CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
        CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
        CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
        CONNECT_PLUGIN_PATH: "/var/lib/kafka-connect/plugins,/usr/share/java,/usr/local/share/kafka,/usr/share/confluent-hub-components"
        #
        # Make sure you set this for the correct path that the library files for InstantClient have been installed into
        LD_LIBRARY_PATH: "/usr/share/java/debezium-connector-oracle/instantclient_19_6/"
      user: root  
      command:
        - bash
        - -c
        - |
          echo "Installing connector plugins"
          confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:5.5.0
          confluent-hub install --no-prompt confluentinc/kafka-connect-datagen:0.3.2
          confluent-hub install --no-prompt confluentinc/kafka-connect-elasticsearch:11.0.0
          confluent-hub install --no-prompt --force mongodb/kafka-connect-mongodb:latest
          confluent-hub install --no-prompt confluentinc/kafka-connect-oracle-cdc:2.7.3
    
          #
          echo "Downloading JDBC drivers"
          cd /usr/share/confluent-hub-components/confluentinc-kafka-connect-jdbc/lib
          curl https://maven.xwiki.org/externals/com/oracle/jdbc/ojdbc8/12.2.0.1/ojdbc8-12.2.0.1.jar -o ojdbc8-12.2.0.1.jar
          # -----------
          # Install Debezium Oracle connector and required libraries
          # -- Download
          curl "https://oss.sonatype.org/service/local/repositories/releases/content/io/debezium/debezium-connector-oracle/1.4.1.Final/debezium-connector-oracle-1.4.1.Final-plugin.tar.gz" | tar xvfz - --directory /usr/share/java/
          # -- Install the required library files
          yum install jq -y
          yum install zip -y
          yum update
          #yum install unzip libaio1 -y
          wget "https://download.oracle.com/otn_software/linux/instantclient/19600/instantclient-basiclite-linux.x64-19.6.0.0.0dbru.zip" -O /tmp/ic.zip 
          unzip /tmp/ic.zip -d /usr/share/java/debezium-connector-oracle/
          # -----------
          # Launch the Kafka Connect worker
          /etc/confluent/docker/run &
          #
          # Don't exit
          sleep infinity  

      networks:
        - my_network